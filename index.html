<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOSIkZboo99nY3eYtn3lhkOk4m_SBpkneq4W3Wuy10QEKBY_YKSgheo-gMFLwhFa3zSA/exec';

const CHED_LOGO_URL = './images/ched-logo.png';
const BP_LOGO_URL = './images/bagong-pilipinas-logo.png';
const ACHIEVE_LOGO_URL = './images/achieve-logo.png';

const REGION_ORDER = [
  'I','II','III','IV-A','V','VI','VII','VIII','IX','X','XI','XII',
  'NCR','CAR','CARAGA','MIMAROPA','NIR','BARMM'
];

let dashboardData = {
  records: [],
  programTable: [],
  disciplineTable: [],
  regionTable: [],
  resultTable: [],
  updatedAt: '',
  kpi: {}
};

let showAllApplications = false;
let disciplinePage = 1;
const DISCIPLINES_PER_PAGE = 15;

function loadPublicLogos() {
  const ched = document.getElementById('chedLogoPreview');
  const bp = document.getElementById('bpLogoPreview');
  const achieve = document.getElementById('achieveLogoPreview');

  if (ched) ched.src = CHED_LOGO_URL;
  if (bp) bp.src = BP_LOGO_URL;
  if (achieve) achieve.src = ACHIEVE_LOGO_URL;
}

function updateDateTime() {
  const now = new Date();

  const todayDate = document.getElementById('todayDate');
  const clockText = document.getElementById('clockText');

  if (todayDate) {
    todayDate.textContent =
      'As of ' +
      now.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }) +
      ' ' +
      now.toLocaleTimeString(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
  }

  if (clockText) {
    clockText.textContent =
      'Time: ' +
      now.toLocaleTimeString(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
  }
}

function loadDashboard() {
  const updatedText = document.getElementById('updatedText');
  const errorText = document.getElementById('errorText');

  if (updatedText) updatedText.textContent = 'Loading data...';
  if (errorText) errorText.textContent = '';

  const callbackName =
    'coeDashboardCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

  let completed = false;

  window[callbackName] = function(data) {
    completed = true;

    try {
      if (!data || data.success === false) {
        if (updatedText) updatedText.textContent = 'Connected, but no valid data.';
        if (errorText) errorText.textContent = data && data.message ? data.message : 'No data returned.';
        return;
      }

      dashboardData = normalizeData(data);
      disciplinePage = 1;
      renderDashboard();

      if (updatedText) {
        updatedText.textContent = dashboardData.updatedAt || new Date().toLocaleString();
      }

      if (errorText) errorText.textContent = '';

    } catch (err) {
      console.error(err);
      if (updatedText) updatedText.textContent = 'Data loaded but render failed.';
      if (errorText) errorText.textContent = err.message || String(err);

    } finally {
      cleanupJSONP(callbackName);
    }
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src =
    APPS_SCRIPT_URL +
    '?mode=data&callback=' +
    encodeURIComponent(callbackName) +
    '&v=' +
    Date.now();

  script.onerror = function() {
    if (completed) return;

    if (updatedText) updatedText.textContent = 'Connection failed.';
    if (errorText) {
      errorText.textContent =
        'Unable to load Apps Script data. Check deployment access and Code.gs doGet.';
    }

    cleanupJSONP(callbackName);
  };

  document.body.appendChild(script);

  setTimeout(function() {
    if (completed) return;

    if (updatedText) updatedText.textContent = 'Connection timeout.';
    if (errorText) {
      errorText.textContent =
        'Apps Script did not return data. Redeploy Code.gs as new version.';
    }

    cleanupJSONP(callbackName);
  }, 30000);
}

function cleanupJSONP(callbackName) {
  const script = document.getElementById(callbackName);
  if (script) script.remove();

  try {
    delete window[callbackName];
  } catch (e) {
    window[callbackName] = undefined;
  }
}

function normalizeData(data) {
  const rawRecords = Array.isArray(data.records) ? data.records : [];

  const records = rawRecords.map(function(record, index) {
    const scoreValue = toNumber(record.score);

    return {
      no: record.no || index + 1,
      region: normalizeRegionValue(record.region),
      hei: record.hei || '',
      program: record.program || '',
      discipline: record.discipline || '',
      score: isNaN(scoreValue) ? '' : scoreValue,
      evaluationResult: normalizeResult(record.evaluationResult),
      evaluator: record.evaluator || 'Unassigned',
      dateEvaluated: record.dateEvaluated || '',
      remarks: record.remarks || '',
      sourceFile: record.sourceFile || ''
    };
  });

  return {
    updatedAt: data.updatedAt || new Date().toLocaleString(),
    kpi: data.kpi || {},
    records: records,
    resultTable: buildCountTable(records, 'evaluationResult', 'Evaluation Result'),
    programTable: buildCountTable(records, 'program', 'Program'),
    disciplineTable: buildCountTable(records, 'discipline', 'Discipline'),
    regionTable: buildRegionTable(records)
  };
}

function renderDashboard() {
  const summary = getSummary();

  setText('totalApplications', fmt(summary.total));
  setText('averageScore', summary.averageScore.toFixed(2));
  setText('passedCount', fmt(summary.passed));
  setText('delibCount', fmt(summary.delib));
  setText('pendingCount', fmt(summary.pending));
  setText('passingScore', fmt(summary.passingScore));
  setText('metaPassingScore', fmt(summary.passingScore));

  document.querySelectorAll('.totalText').forEach(function(el) {
    el.textContent = fmt(summary.total);
  });

  populateFilters();
  renderTopProgramsTable();
  renderLiveDatabaseTable();
  drawBreakdownChart();
  drawDisciplineChart();
  drawRegionChart();
}

function getSummary() {
  const records = dashboardData.records || [];

  let passed = 0;
  let delib = 0;
  let pending = 0;
  let scoreTotal = 0;
  let scoreCount = 0;

  records.forEach(function(record) {
    const result = normalizeResult(record.evaluationResult);
    const score = toNumber(record.score);

    if (result === 'QUALIFIED / PASSED') passed++;
    else if (result === 'FOR DELIBERATION') delib++;
    else pending++;

    if (!isNaN(score)) {
      scoreTotal += score;
      scoreCount++;
    }
  });

  return {
    total: records.length,
    passed: passed,
    delib: delib,
    pending: pending,
    averageScore: scoreCount ? scoreTotal / scoreCount : 0,
    passingScore: dashboardData.kpi.passingScore || 60
  };
}

function populateFilters() {
  const regionFilter = document.getElementById('regionFilter');
  const disciplineFilter = document.getElementById('disciplineFilter');

  if (!regionFilter || !disciplineFilter) return;

  const currentRegion = regionFilter.value;
  const currentDiscipline = disciplineFilter.value;

  regionFilter.innerHTML =
    '<option value="">All Regions</option>' +
    REGION_ORDER.map(function(region) {
      return '<option value="' + escapeHtml(region) + '">' + escapeHtml(region) + '</option>';
    }).join('');

  const disciplines = dashboardData.disciplineTable
    .slice(1)
    .map(function(row) { return row[0]; })
    .filter(function(value) { return value && value !== 'Unspecified'; })
    .sort();

  disciplineFilter.innerHTML =
    '<option value="">All Disciplines</option>' +
    disciplines.map(function(discipline) {
      return '<option value="' + escapeHtml(discipline) + '">' + escapeHtml(discipline) + '</option>';
    }).join('');

  regionFilter.value = currentRegion;
  disciplineFilter.value = currentDiscipline;
}

function renderTopProgramsTable() {
  const table = document.getElementById('topProgramsTable');
  if (!table) return;

  const rows = dashboardData.programTable.slice(1, 6);

  let html = `
    <tr>
      <th class="left">Program</th>
      <th>Applications</th>
    </tr>
  `;

  rows.forEach(function(row) {
    html += `
      <tr>
        <td class="left">${escapeHtml(row[0])}</td>
        <td><b>${fmt(row[1])}</b></td>
      </tr>
    `;
  });

  if (!rows.length) {
    html += '<tr><td colspan="2">No program data yet.</td></tr>';
  }

  table.innerHTML = html;
}

function renderLiveDatabaseTable() {
  const table = document.getElementById('liveDatabaseTable');
  if (!table) return;

  const filteredRecords = getFilteredDatabaseRecords();
  let records = filteredRecords;

  if (!showAllApplications) {
    records = getRecentEvaluatedRecords(filteredRecords).slice(0, 5);
  }

  let html = `
    <tr>
      <th>No.</th>
      <th>Region</th>
      <th>HEI</th>
      <th>Program</th>
      <th>Discipline</th>
      <th>Score</th>
      <th>Result</th>
      <th>Evaluator</th>
      <th>Date Evaluated</th>
    </tr>
  `;

  records.forEach(function(record) {
    html += `
      <tr>
        <td>${escapeHtml(record.no)}</td>
        <td><b>${escapeHtml(record.region)}</b></td>
        <td class="left">${escapeHtml(record.hei)}</td>
        <td class="left">${escapeHtml(record.program)}</td>
        <td>${escapeHtml(record.discipline)}</td>
        <td>${record.score === '' ? 'N/A' : Number(record.score).toFixed(2)}</td>
        <td>${resultText(record.evaluationResult)}</td>
        <td>${escapeHtml(record.evaluator || '-')}</td>
        <td>${escapeHtml(record.dateEvaluated || '-')}</td>
      </tr>
    `;
  });

  if (!records.length) {
    html += '<tr><td colspan="9">No recent evaluated application record found.</td></tr>';
  }

  table.innerHTML = html;

  setText('showingCount', fmt(records.length));
  setText('filteredCount', fmt(filteredRecords.length));

  const btn = document.getElementById('viewAllBtn');
  if (btn) {
    btn.textContent = showAllApplications
      ? 'Show Recent Evaluated Applications ↑'
      : 'View All Applications ›';
  }
}

function getFilteredDatabaseRecords() {
  const search = getValue('searchInput').toLowerCase().trim();
  const resultFilter = getValue('resultFilter');
  const regionFilter = getValue('regionFilter');
  const disciplineFilter = getValue('disciplineFilter');

  let records = (dashboardData.records || []).slice();

  records.sort(function(a, b) {
    const dateB = getSortableDateValue(b);
    const dateA = getSortableDateValue(a);

    if (dateB !== dateA) return dateB - dateA;

    return Number(b.no || 0) - Number(a.no || 0);
  });

  if (search) {
    records = records.filter(function(record) {
      return [
        record.no,
        record.region,
        record.hei,
        record.program,
        record.discipline,
        record.score,
        record.evaluationResult,
        record.evaluator,
        record.dateEvaluated
      ].join(' ').toLowerCase().includes(search);
    });
  }

  if (resultFilter) {
    records = records.filter(function(record) {
      return record.evaluationResult === resultFilter;
    });
  }

  if (regionFilter) {
    records = records.filter(function(record) {
      return record.region === regionFilter;
    });
  }

  if (disciplineFilter) {
    records = records.filter(function(record) {
      return record.discipline === disciplineFilter;
    });
  }

  return records;
}

function getRecentEvaluatedRecords(records) {
  return records
    .filter(isEvaluatedRecord)
    .sort(function(a, b) {
      const dateB = getSortableDateValue(b);
      const dateA = getSortableDateValue(a);

      if (dateB !== dateA) return dateB - dateA;

      return Number(b.no || 0) - Number(a.no || 0);
    });
}

function toggleViewAll() {
  showAllApplications = !showAllApplications;
  renderLiveDatabaseTable();
}

function drawBreakdownChart() {
  const setup = setupCanvas('breakdownChart');
  if (!setup) return;

  const ctx = setup.ctx;
  const w = setup.w;
  const h = setup.h;
  const s = getSummary();

  ctx.clearRect(0, 0, w, h);

  const values = [s.passed, s.delib, s.pending];
  const labels = ['Qualified / Passed', 'For Deliberation', 'Pending Evaluation'];
  const colors = ['#11b94c', '#ffc400', '#ec3346'];
  const total = s.total || 1;

  const cx = w * .32;
  const cy = h * .47;
  const r = Math.min(w, h) * .32;

  let start = -Math.PI / 2;

  values.forEach(function(value, index) {
    const angle = value / total * Math.PI * 2;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = colors[index];
    ctx.fill();

    start += angle;
  });

  ctx.beginPath();
  ctx.arc(cx, cy, r * .46, 0, Math.PI * 2);
  ctx.fillStyle = cssVar('--card');
  ctx.fill();

  let y = h * .22;

  labels.forEach(function(label, index) {
    ctx.fillStyle = colors[index];
    ctx.beginPath();
    ctx.arc(w * .65, y, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = cssVar('--text');
    ctx.font = '14px Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, w * .70, y);

    ctx.fillText(
      fmt(values[index]) + ' (' + percent(values[index], s.total).toFixed(1) + '%)',
      w * .70,
      y + 24
    );

    y += 58;
  });
}

function drawDisciplineChart() {
  const setup = setupCanvas('disciplineChart');
  if (!setup) return;

  const ctx = setup.ctx;
  const w = setup.w;
  const h = setup.h;

  ctx.clearRect(0, 0, w, h);

  const allRows = dashboardData.disciplineTable
    .slice(1)
    .filter(function(row) {
      return row[0] && row[0] !== 'Unspecified';
    });

  if (!allRows.length) {
    drawNoData(ctx, w, h, 'No discipline data yet.');
    renderDisciplinePagination(0);
    return;
  }

  const totalPages = Math.max(1, Math.ceil(allRows.length / DISCIPLINES_PER_PAGE));

  if (disciplinePage > totalPages) disciplinePage = totalPages;
  if (disciplinePage < 1) disciplinePage = 1;

  const rows = allRows.slice(
    (disciplinePage - 1) * DISCIPLINES_PER_PAGE,
    disciplinePage * DISCIPLINES_PER_PAGE
  );

  const values = rows.map(function(row) { return Number(row[1]) || 0; });
  const max = Math.max.apply(null, values.concat([1]));

  const left = w < 500 ? 118 : 170;
  const right = 42;
  const top = 12;
  const bottom = 18;
  const plotW = w - left - right;
  const plotH = h - top - bottom;
  const gap = plotH / rows.length;
  const barH = Math.max(7, Math.min(18, gap * 0.58));

  rows.forEach(function(row, index) {
    const label = String(row[0]);
    const value = Number(row[1]) || 0;
    const y = top + gap * index + (gap - barH) / 2;
    const barW = plotW * value / max;

    ctx.fillStyle = cssVar('--text');
    ctx.font = w < 500 ? '9px Arial' : '11px Arial';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(shortText(label, w < 500 ? 18 : 30), left - 10, y + barH / 2);

    const grad = ctx.createLinearGradient(left, y, left + barW, y);
    grad.addColorStop(0, '#1683ff');
    grad.addColorStop(1, '#075bc8');

    roundRect(ctx, left, y, Math.max(barW, value > 0 ? 4 : 0), barH, 4, grad);

    ctx.fillStyle = cssVar('--text');
    ctx.font = w < 500 ? 'bold 9px Arial' : 'bold 11px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(fmt(value), left + barW + 6, y + barH / 2);
  });

  renderDisciplinePagination(totalPages);
}

function renderDisciplinePagination(totalPages) {
  const container = document.getElementById('disciplinePagination');
  if (!container) return;

  if (!totalPages || totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = '<button class="discipline-page-control" onclick="prevDisciplinePage()">‹ Prev</button>';

  for (let i = 1; i <= totalPages; i++) {
    html += '<button class="discipline-page-control ' +
      (i === disciplinePage ? 'active' : '') +
      '" onclick="goToDisciplinePage(' + i + ')">' + i + '</button>';
  }

  html += '<button class="discipline-page-control" onclick="nextDisciplinePage()">Next ›</button>';

  container.innerHTML = html;
}

function goToDisciplinePage(page) {
  disciplinePage = page;
  drawDisciplineChart();
}

function nextDisciplinePage() {
  const totalPages = Math.max(
    1,
    Math.ceil((dashboardData.disciplineTable.length - 1) / DISCIPLINES_PER_PAGE)
  );

  disciplinePage++;
  if (disciplinePage > totalPages) disciplinePage = 1;

  drawDisciplineChart();
}

function prevDisciplinePage() {
  const totalPages = Math.max(
    1,
    Math.ceil((dashboardData.disciplineTable.length - 1) / DISCIPLINES_PER_PAGE)
  );

  disciplinePage--;
  if (disciplinePage < 1) disciplinePage = totalPages;

  drawDisciplineChart();
}

function drawRegionChart() {
  const setup = setupCanvas('regionChart');
  if (!setup) return;

  const ctx = setup.ctx;
  const w = setup.w;
  const h = setup.h;

  ctx.clearRect(0, 0, w, h);

  const rows = dashboardData.regionTable
    .slice(1)
    .filter(function(row) { return row[0] !== 'Unspecified'; });

  if (!rows.length) {
    drawNoData(ctx, w, h, 'No regional data yet.');
    return;
  }

  const labels = rows.map(function(row) { return String(row[0]); });
  const values = rows.map(function(row) { return Number(row[1]) || 0; });
  const max = Math.max.apply(null, values.concat([1]));

  const left = 42;
  const right = 22;
  const top = 24;
  const bottom = 78;
  const plotW = w - left - right;
  const plotH = h - top - bottom;

  const stepX = labels.length > 1 ? plotW / (labels.length - 1) : plotW;

  function getX(index) {
    return left + stepX * index;
  }

  function getY(value) {
    return top + plotH - value / max * plotH;
  }

  ctx.beginPath();
  ctx.moveTo(getX(0), getY(values[0]));

  for (let i = 1; i < values.length; i++) {
    ctx.lineTo(getX(i), getY(values[i]));
  }

  ctx.strokeStyle = '#33cfff';
  ctx.lineWidth = 3;
  ctx.stroke();

  values.forEach(function(value, index) {
    const x = getX(index);
    const y = getY(value);

    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#33cfff';
    ctx.fill();

    ctx.fillStyle = cssVar('--text');
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(fmt(value), x, y - 8);
  });

  ctx.fillStyle = cssVar('--text');
  ctx.font = '10.5px Arial';
  ctx.textAlign = 'right';

  labels.forEach(function(label, index) {
    const x = getX(index);
    const y = top + plotH + 21;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-Math.PI / 4);
    ctx.fillText(label, 0, 0);
    ctx.restore();
  });
}

function setupCanvas(id) {
  const canvas = document.getElementById(id);
  if (!canvas) return null;

  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;

  canvas.width = Math.max(rect.width * ratio, 1);
  canvas.height = Math.max(rect.height * ratio, 1);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  return {
    canvas: canvas,
    ctx: ctx,
    w: rect.width,
    h: rect.height
  };
}

function drawNoData(ctx, w, h, text) {
  ctx.fillStyle = cssVar('--text');
  ctx.font = '14px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2);
}

function roundRect(ctx, x, y, w, h, r, fillStyle) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

function resultText(value) {
  const result = normalizeResult(value);
  let cls = 'status-pending';

  if (result === 'QUALIFIED / PASSED') cls = 'status-pass';
  if (result === 'FOR DELIBERATION') cls = 'status-delib';

  return '<span class="status-pill ' + cls + '">' + escapeHtml(result) + '</span>';
}

function normalizeResult(value) {
  const v = String(value || '').trim().toUpperCase();

  if (
    v === 'QUALIFIED / PASSED' ||
    v === 'QUALIFIED/PASSED' ||
    v === 'PASSED' ||
    v === 'QUALIFIED'
  ) return 'QUALIFIED / PASSED';

  if (
    v === 'FOR DELIBERATION' ||
    v === 'DELIBERATION' ||
    v === 'FOR-DELIBERATION'
  ) return 'FOR DELIBERATION';

  return 'Pending Evaluation';
}

function normalizeRegionValue(region) {
  let r = String(region || '').trim().toUpperCase();

  if (!r) return 'Unspecified';

  r = r.replace(/\s+/g, ' ');
  r = r.replace(/^REGION /, '');
  r = r.replace(/^REG /, '');
  r = r.replace(/\./g, '');

  const map = {
    '1':'I','01':'I','I':'I',
    '2':'II','02':'II','II':'II',
    '3':'III','03':'III','III':'III',
    'IVA':'IV-A','IV A':'IV-A','IV-A':'IV-A','4A':'IV-A','4-A':'IV-A','CALABARZON':'IV-A',
    'V':'V','5':'V','05':'V',
    'VI':'VI','6':'VI','06':'VI',
    'VII':'VII','7':'VII','07':'VII',
    'VIII':'VIII','8':'VIII','08':'VIII',
    'IX':'IX','9':'IX','09':'IX',
    'X':'X','10':'X',
    'XI':'XI','11':'XI',
    'XII':'XII','12':'XII',
    'NCR':'NCR',
    'CAR':'CAR',
    'CARAGA':'CARAGA',
    'MIMAROPA':'MIMAROPA',
    'IVB':'MIMAROPA','IV-B':'MIMAROPA','4B':'MIMAROPA',
    'NIR':'NIR',
    'BARMM':'BARMM','ARMM':'BARMM'
  };

  return map[r] || r;
}

function toNumber(value) {
  if (typeof value === 'number') return value;

  const cleaned = String(value ?? '').replace(/[^0-9.\-]/g, '').trim();

  if (cleaned === '') return NaN;

  return Number(cleaned);
}

function getSortableDateValue(record) {
  const text = String(record.dateEvaluated || '').trim();

  if (!text || text === '-') return 0;

  const parsed = new Date(text);

  if (!isNaN(parsed.getTime())) return parsed.getTime();

  return 0;
}

function isEvaluatedRecord(record) {
  const result = normalizeResult(record.evaluationResult);
  const score = toNumber(record.score);
  const dateText = String(record.dateEvaluated || '').trim();

  if (result === 'Pending Evaluation') return false;
  if (!isNaN(score)) return true;
  if (dateText && dateText !== '-') return true;

  return false;
}

function buildCountTable(records, field, headerName) {
  const map = {};

  records.forEach(function(record) {
    const key = String(record[field] || 'Unspecified').trim() || 'Unspecified';
    map[key] = (map[key] || 0) + 1;
  });

  return [[headerName, 'Count']].concat(
    Object.keys(map)
      .sort(function(a, b) { return map[b] - map[a]; })
      .map(function(key) { return [key, map[key]]; })
  );
}

function buildRegionTable(records) {
  const map = {};

  records.forEach(function(record) {
    const region = normalizeRegionValue(record.region);
    map[region] = (map[region] || 0) + 1;
  });

  const table = [['Region', 'Applications']];

  REGION_ORDER.forEach(function(region) {
    table.push([region, map[region] || 0]);
  });

  return table;
}

function percent(value, total) {
  if (!total) return 0;
  return Number(value || 0) / Number(total || 1) * 100;
}

function fmt(value) {
  return Number(value || 0).toLocaleString();
}

function shortText(value, max) {
  const text = String(value || '');
  return text.length > max ? text.slice(0, max - 1) + '…' : text;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function cssVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

function getValue(id) {
  const el = document.getElementById(id);
  return el ? el.value || '' : '';
}

document.addEventListener('DOMContentLoaded', function() {
  loadPublicLogos();
  updateDateTime();
  setInterval(updateDateTime, 1000);

  loadDashboard();
  setInterval(loadDashboard, 60000);

  window.addEventListener('resize', function() {
    if (dashboardData.records.length) {
      drawBreakdownChart();
      drawDisciplineChart();
      drawRegionChart();
    }
  });
});
</script>
